<!doctype html>
<title>Webex Reports — Sign in</title>
<style>
  body { font-family: Segoe UI, sans-serif; background:#f5f5f5; display:flex;
         align-items:center; justify-content:center; height:100vh; }
  .card { background:#fff; padding:2rem; border-radius:8px; box-shadow:0 2px 8px #0002; }
  input { padding:.5rem; border:1px solid #ccc; border-radius:4px; }
  button { padding:.5rem 1rem; margin-top:.75rem; background:#0d6efd; color:#fff;
           border:0; border-radius:4px; cursor:pointer; }
</style>
<div class="card">
  <h2 style="margin-top:0;display:flex;align-items:center;gap:.5rem">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="36" height="36">
    Webex Reports
  </h2>
  {% with messages = get_flashed_messages() %}{% if messages %}
    <p style="color:#b00">{{ messages[0] }}</p>
  {% endif %}{% endwith %}
  <form method="post">
    <input type="password" name="password" placeholder="Admin password" autofocus>
    <br><button type="submit">Sign in</button>
  </form>
</div>
